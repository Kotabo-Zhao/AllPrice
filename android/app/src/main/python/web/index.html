<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>全价比价 · 搜全网最低价</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f5f0">
<script src="vue.global.prod.js"></script>
<style>
  :root{
    --bg:#f7f5f0; --card:#fff; --text:#1f2328; --text2:#5c6270; --text3:#9aa1ad;
    --border:#e6e2d8; --line:#eee9df;
    --accent:#c0392b; --accent-soft:#faf0ee;   /* 朱砂 */
    --green:#1e9e5a; --green-bg:#e9f7ef;
    --amber:#b8860b; --amber-bg:#fbf4e3;
    --ink:#2f3b4c;
    --radius:12px; --radius-sm:8px;
    --shadow:0 1px 3px rgba(47,59,76,.06),0 4px 16px rgba(47,59,76,.05);
    --font-ui:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    --font-serif:"Songti SC","Noto Serif SC","SimSun",serif;
  }
  [data-theme="dark"]{
    --bg:#16181d; --card:#1e2128; --text:#e8e6e0; --text2:#a0a5b0; --text3:#6b7078;
    --border:#2e323b; --line:#292d35;
    --accent:#e2604f; --accent-soft:#33201d;
    --green:#4dbb7f; --green-bg:#12261b;
    --amber:#d3a34a; --amber-bg:#2a2413;
    --ink:#d5dbe4;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ui);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
  #app{min-height:100dvh;display:flex;flex-direction:column}

  /* ═══ Header ═══ */
  .header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
  .header-inner{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px}
  .logo{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
  .logo-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:16px;font-weight:600}
  .logo-name{font-size:17px;font-weight:600;letter-spacing:1px;font-family:var(--font-serif)}
  .logo-sub{font-size:11px;color:var(--text3);letter-spacing:2px;margin-top:-2px}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .icon-btn{width:32px;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}

  /* ═══ Hero Search ═══ */
  .hero{padding:48px 20px 40px;text-align:center}
  .hero h1{font-size:clamp(26px,4.5vw,38px);font-weight:600;font-family:var(--font-serif);letter-spacing:2px;margin-bottom:8px}
  .hero .slogan{font-size:14px;color:var(--text2);margin-bottom:28px;letter-spacing:.5px}
  .search-box{max-width:640px;margin:0 auto;display:flex;gap:0;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:5px;box-shadow:var(--shadow);transition:border .2s}
  .search-box:focus-within{border-color:var(--accent)}
  .search-box input{flex:1;border:none;outline:none;background:transparent;padding:12px 16px;font-size:16px;color:var(--text);font-family:var(--font-ui)}
  .search-box input::placeholder{color:var(--text3)}
  .search-btn{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 26px;font-size:15px;font-weight:500;cursor:pointer;transition:background .15s;letter-spacing:1px}
  .search-btn:hover{background:#a83226}
  .search-btn:disabled{opacity:.5;cursor:not-allowed}
  .hot-tags{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .hot-tag{font-size:12px;color:var(--text2);background:var(--card);border:1px solid var(--border);padding:4px 12px;border-radius:20px;cursor:pointer;transition:all .15s}
  .hot-tag:hover{color:var(--accent);border-color:var(--accent)}

  /* ═══ Main ═══ */
  .main{flex:1;max-width:1080px;margin:0 auto;padding:0 20px 80px;width:100%}
  .searching{padding:60px 0;text-align:center}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .searching p{color:var(--text2);font-size:14px}
  .search-status{margin-top:10px;font-size:12px;color:var(--text3)}

  /* ═══ Result Header ═══ */
  .result-head{display:flex;align-items:baseline;gap:12px;margin:28px 0 6px;flex-wrap:wrap}
  .result-head .kw{font-size:22px;font-weight:600;font-family:var(--font-serif)}
  .result-head .cnt{font-size:13px;color:var(--text3)}
  .result-meta{font-size:12px;color:var(--text3);margin-bottom:20px;display:flex;gap:16px;flex-wrap:wrap}
  .result-meta .src{display:flex;align-items:center;gap:4px}
  .src-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
  .src-dot.off{background:var(--text3)}

  /* ═══ Product Card ═══ */
  .product-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;overflow:hidden;box-shadow:var(--shadow)}
  .pc-top{display:flex;gap:16px;padding:18px 20px;align-items:flex-start}
  .pc-thumb{width:84px;height:84px;border-radius:10px;background:var(--bg);border:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}
  .pc-thumb img{width:100%;height:100%;object-fit:cover}
  .pc-info{flex:1;min-width:0}
  .pc-title{font-size:16px;font-weight:600;line-height:1.5;margin-bottom:6px}
  .pc-specs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .spec-pill{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--text2)}
  .pc-best{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
  .best-price{font-size:26px;font-weight:700;color:var(--accent)}
  .best-price .cur{font-size:15px;font-weight:500;margin-right:2px}
  .best-label{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:6px;font-weight:500}
  .best-save{font-size:12px;color:var(--green)}
  .pc-toggle{width:100%;border:none;background:var(--bg);border-top:1px solid var(--line);padding:10px;color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
  .pc-toggle:hover{background:var(--line)}
  .pc-toggle .arrow{transition:transform .2s;display:inline-block}
  .pc-toggle.open .arrow{transform:rotate(180deg)}

  /* ═══ Platform Offer Table ═══ */
  .offer-table{width:100%;border-collapse:collapse;font-size:13.5px}
  .offer-table th{background:var(--bg);color:var(--text2);font-weight:500;font-size:12px;padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  .offer-table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
  .offer-table tr:last-child td{border-bottom:none}
  .offer-table tr:hover td{background:var(--bg)}
  .plat{display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
  .plat-badge{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0}
  .plat-jd{background:#e1251b}.plat-taobao{background:#ff5000}.plat-pdd{background:#e02e24}.plat-mock{background:#8b8f99}
  .offer-price{font-weight:600;white-space:nowrap}
  .offer-sale{font-size:12px;color:var(--text3);text-decoration:line-through;margin-left:6px;font-weight:400}
  .offer-final{font-weight:700;color:var(--accent);white-space:nowrap}
  .offer-final .tag{font-size:10px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:1px}
  .offer-detail{font-size:12px;color:var(--text2);max-width:260px;line-height:1.5}
  .offer-buy{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:6px 16px;font-size:12.5px;cursor:pointer;transition:all .15s;white-space:nowrap}
  .offer-buy:hover{background:var(--accent);color:#fff}
  .offer-lowest{background:var(--green-bg)!important}
  .lowest-badge{display:inline-block;background:var(--green);color:#fff;font-size:10px;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}

  /* ═══ AI Recommend ═══ */
  .ai-card{margin:22px 0;border-radius:var(--radius);padding:18px 20px;display:flex;gap:14px;align-items:flex-start;border:1px solid var(--amber);background:var(--amber-bg)}
  .ai-icon{width:34px;height:34px;border-radius:9px;background:var(--amber);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
  .ai-body{flex:1;min-width:0}
  .ai-title{font-weight:600;font-size:14.5px;margin-bottom:6px}
  .ai-text{font-size:13.5px;color:var(--text2);line-height:1.7}
  .ai-text b{color:var(--amber)}

  /* ═══ Price Trend ═══ */
  .trend-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;box-shadow:var(--shadow)}
  .trend-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .trend-title{font-size:15px;font-weight:600}
  .trend-sub{font-size:12px;color:var(--text3)}
  .trend-svg{width:100%;height:260px;display:block}
  .trend-legend{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
  .legend-item i{width:16px;height:3px;border-radius:2px;display:inline-block}

  /* ═══ Empty / Error ═══ */
  .empty{padding:70px 20px;text-align:center}
  .empty-icon{font-size:44px;margin-bottom:14px;opacity:.6}
  .empty h3{font-size:17px;margin-bottom:8px}
  .empty p{font-size:13px;color:var(--text2);max-width:420px;margin:0 auto}

  /* ═══ Toast ═══ */
  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
  .toast.show{opacity:1}

  /* ═══ Footer ═══ */
  .footer{text-align:center;padding:24px 20px 40px;color:var(--text3);font-size:12px;border-top:1px solid var(--line)}

  /* ═══ Responsive ═══ */
  @media(max-width:768px){
    .hero{padding:36px 16px 30px}
    .main{padding:0 14px 70px}
    .pc-top{padding:14px 16px;gap:12px}
    .pc-thumb{width:68px;height:68px}
    .best-price{font-size:22px}
    .offer-table{font-size:12.5px}
    .offer-table th,.offer-table td{padding:9px 8px}
    .offer-detail{display:none}
    .offer-buy{padding:5px 12px;font-size:12px}
    .trend-svg{height:220px}
    .pc-title{font-size:14.5px}
    .search-box input{font-size:15px;padding:10px 14px}
    .search-btn{padding:0 18px}
    .ai-card{padding:14px 16px}
  }
  @media(max-width:420px){
    .offer-sale{display:none}
    .result-head .kw{font-size:19px}
    .plat-badge{width:20px;height:20px;font-size:10px}
  }
</style>
</head>
<body>
<div id="app" v-cloak>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo" @click="reset">
        <div class="logo-mark">价</div>
        <div>
          <div class="logo-name">全价比价</div>
          <div class="logo-sub">ALL PRICE</div>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" @click="toggleTheme" :title="theme==='dark'?'浅色':'深色'">{{ theme==='dark' ? '☀️' : '🌙' }}</button>
      </div>
    </div>
  </header>

  <!-- Hero Search -->
  <section class="hero" v-if="!searched">
    <h1>搜全网 · 比全价</h1>
    <p class="slogan">一个商品，全网所有平台最低到手价</p>
    <div class="search-box">
      <input v-model="keyword" @keyup.enter="doSearch" placeholder="输入商品名称，如：iPhone 15 Pro 256G" />
      <button class="search-btn" @click="doSearch" :disabled="loading || !keyword.trim()">{{ loading ? '搜索中…' : '比价' }}</button>
    </div>
    <div class="hot-tags">
      <span class="hot-tag" v-for="t in hotKeywords" :key="t" @click="keyword=t;doSearch()">{{ t }}</span>
    </div>
  </section>

  <!-- Main -->
  <main class="main" v-else>
    <!-- Loading -->
    <div class="searching" v-if="loading">
      <div class="spinner"></div>
      <p>正在全网抓取价格…</p>
      <div class="search-status">{{ loadingStatus }}</div>
    </div>

    <!-- Results -->
    <template v-else>
      <div class="result-head">
        <span class="kw">「{{ keyword }}」</span>
        <span class="cnt">共找到 {{ products.length }} 款商品 · {{ totalOffers }} 个平台报价</span>
      </div>
      <div class="result-meta">
        <span class="src" v-for="(s,i) in sourceStatus" :key="i">
          <span class="src-dot" :class="{off:!s.ok}"></span>{{ s.label }}{{ s.ok ? '' : '·暂不可用' }}
        </span>
        <span>更新于 {{ updatedAt }}</span>
      </div>

      <!-- AI 综合推荐 -->
      <div class="ai-card" v-if="bestProduct">
        <div class="ai-icon">智</div>
        <div class="ai-body">
          <div class="ai-title">AI 综合推荐</div>
          <div class="ai-text" v-html="aiRecommendText"></div>
        </div>
      </div>

      <!-- Product Cards -->
      <div class="product-card" v-for="(p,i) in products" :key="p.sku_fingerprint">
        <div class="pc-top">
          <div class="pc-thumb"><span v-if="!p.image_url">{{ emojiFor(i) }}</span><img v-else :src="p.image_url" /></div>
          <div class="pc-info">
            <div class="pc-title">{{ p.name }}</div>
            <div class="pc-specs">
              <span class="spec-pill" v-for="(v,k) in p.specs" :key="k">{{ k }}:{{ v }}</span>
            </div>
            <div class="pc-best">
              <span class="best-price"><span class="cur">¥</span>{{ fmt(p.best_price) }}</span>
              <span class="best-label">{{ p.best_platform_label }}最低</span>
              <span class="best-save" v-if="bestSaveOf(p) > 0">比标价省 ¥{{ fmt(bestSaveOf(p)) }}</span>
            </div>
          </div>
        </div>
        <button class="pc-toggle" :class="{open:expanded[i]}" @click="toggleExpand(i)">
          查看 {{ p.offers.length }} 个平台报价与优惠 <span class="arrow">▾</span>
        </button>
        <div v-show="expanded[i]">
          <table class="offer-table">
            <thead>
              <tr><th>平台</th><th>售价</th><th>优惠后到手价</th><th>优惠明细</th><th></th></tr>
            </thead>
            <tbody>
              <tr v-for="o in p.offers" :key="o.platform" :class="{'offer-lowest': o.final_price===p.best_price}">
                <td><div class="plat"><span class="plat-badge" :class="'plat-'+o.platform">{{ o.platform_label[0] }}</span>{{ o.platform_label }}<span class="lowest-badge" v-if="o.final_price===p.best_price">最低</span></div></td>
                <td><span class="offer-price">¥{{ fmt(o.sale_price) }}</span><span class="offer-sale">¥{{ fmt(o.list_price) }}</span></td>
                <td><span class="offer-final">¥{{ fmt(o.final_price) }}</span></td>
                <td><div class="offer-detail">{{ o.price_detail || '—' }}</div></td>
                <td><a :href="o.url" target="_blank" rel="noopener"><button class="offer-buy">去购买</button></a></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 走势图 -->
      <div class="trend-card" v-if="bestProduct">
        <div class="trend-head">
          <div class="trend-title">📈 历史价格走势（{{ bestProduct.name }}）</div>
          <div class="trend-sub">90 天 · 各平台最低到手价（模拟走势，接入真实数据源后自动更新）</div>
        </div>
        <svg class="trend-svg" :viewBox="trendViewBox" preserveAspectRatio="none" role="img" aria-label="90天价格走势图">
          <defs>
            <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--accent)" stop-opacity=".18"/>
              <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <g v-for="(line,li) in trendLines" :key="li">
            <path :d="line.area" fill="url(#trendFill)" stroke="none"/>
            <path :d="line.path" fill="none" :stroke="line.color" stroke-width="2" stroke-linejoin="round"/>
          </g>
        </svg>
        <div class="trend-legend">
          <span v-for="(line,li) in trendLines" :key="'l'+li" class="legend-item">
            <i :style="{background:line.color}"></i>{{ line.name }}
          </span>
        </div>
      </div>

      <!-- Empty -->
      <div class="empty" v-if="!loading && products.length===0">
        <div class="empty-icon">🔍</div>
        <h3>未找到相关商品</h3>
        <p>{{ errorMsg || '试试更精确的关键词，如「品牌+型号」' }}</p>
      </div>
    </template>
  </main>

  <!-- Footer -->
  <footer class="footer">
    全价比价 · 数据仅供参考，实际价格以各平台结算为准 · 价格抓取于 {{ updatedAt }}
  </footer>

  <div class="toast" :class="{show:toast.show}">{{ toast.msg }}</div>
</div>

<script>
const { createApp, ref, computed, onMounted, nextTick } = Vue;
const API = location.origin + '/api';
const HOT = ['iPhone 15 Pro', '华为 Mate 60 Pro', '小米14 Pro', '索尼 WH-1000XM5', '戴森 V15'];

createApp({
  setup() {
    const keyword = ref('');
    const products = ref([]);
    const searched = ref(false);
    const loading = ref(false);
    const loadingStatus = ref('');
    const errorMsg = ref('');
    const expanded = ref({});
    const sourceStatus = ref([]);
    const updatedAt = ref('');
    const theme = ref(localStorage.getItem('allprice_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    const hotKeywords = HOT;
    const toast = ref({show:false, msg:''});

    const totalOffers = computed(() => products.value.reduce((s,p)=>s+p.offers.length,0));
    const bestProduct = computed(() => products.value[0] || null);

    // ── SVG 走势图（零依赖，任何环境可渲染） ──
    const TREND_COLORS = ['#c0392b','#2f6fed','#1e9e5a','#b8860b','#7c5cff'];
    const trendViewBox = '0 0 600 240';
    const trendLines = computed(() => {
      const p = bestProduct.value;
      if(!p) return [];
      const platforms = [...new Set(p.offers.map(o=>o.platform_label))];
      const days = 90;
      return platforms.map((label, pi) => {
        const base = p.best_price || 100;
        const pts = [];
        let v = base * 0.96;
        for(let i=0;i<=days;i++){
          v = Math.max(base*0.9, v * (0.9995 + Math.random()*0.0012));
          pts.push(v);
        }
        // 归一化到 SVG 坐标
        const min = Math.min(...pts), max = Math.max(...pts);
        const span = (max-min) || 1;
        const W = 600, H = 220, pad = 12;
        const step = (W - pad*2) / days;
        const path = pts.map((val,i)=>{
          const x = pad + i*step;
          const y = pad + (H - pad*2) * (1 - (val-min)/span);
          return (i===0?'M':'L') + x.toFixed(1) + ' ' + y.toFixed(1);
        }).join(' ');
        const last = pts[pts.length-1];
        const lastY = pad + (H - pad*2) * (1 - (last-min)/span);
        const area = path + ` L${pad+days*step} ${H-pad} L${pad} ${H-pad} Z`;
        return { name:label, color:TREND_COLORS[pi%TREND_COLORS.length], path, area };
      });
    });

    function fmt(n){ return n===null||n===undefined ? '—' : Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function listPriceOf(p){ const o=p.offers[0]; return o ? o.list_price : p.best_price; }
    function bestSaveOf(p){ const save = listPriceOf(p) - p.best_price; return save > 0 ? save : 0; }
    function emojiFor(i){ return ['📱','🎧','⌚','💻','📷','🎮'][i%6]; }

    const aiRecommendText = computed(() => {
      const p = bestProduct.value;
      if(!p) return '';
      // 优先用后端推荐（真实 AI 或后端规则引擎），失败再用本地兜底
      if(p.recommendation) return p.recommendation.replace(/\n/g,'<br>');
      const best = p.offers.find(o=>o.final_price===p.best_price);
      if(!best) return '';
      const otherCount = p.offers.length - 1;
      let t = `<b>推荐：${best.platform_label} ¥${fmt(p.best_price)}</b>`;
      t += ` 为全网最低到手价。`;
      if(otherCount>0) t += ` 比其他 ${otherCount} 个平台最低可再省 ¥${fmt(p.offers[1] ? p.offers[1].final_price - p.best_price : 0)}。`;
      t += ` 该价格已包含${best.price_detail ? '优惠叠加' : '当前活动价'}。`;
      t += ` 建议关注大促节点价格波动，历史低位时可果断入手。`;
      return t;
    });

    function toggleTheme(){
      theme.value = theme.value==='dark' ? 'light' : 'dark';
      localStorage.setItem('allprice_theme', theme.value);
      document.documentElement.setAttribute('data-theme', theme.value);
    }
    function toggleExpand(i){ expanded.value[i] = !expanded.value[i]; }
    function reset(){ searched.value=false; products.value=[]; keyword.value=''; }
    function showToast(msg){ toast.value={show:true,msg}; setTimeout(()=>toast.value.show=false, 2200); }

    async function doSearch(){
      const kw = keyword.value.trim();
      if(!kw || loading.value) return;
      loading.value = true;
      searched.value = true;
      errorMsg.value = '';
      products.value = [];
      loadingStatus.value = '正在搜索京东、淘宝、拼多多…';
      const phases = ['正在抓取京东报价…','正在抓取淘宝报价…','正在抓取拼多多报价…','正在计算优惠叠加…'];
      const timer = setInterval(()=>{ loadingStatus.value = phases[Math.floor(Math.random()*phases.length)]; }, 1400);
      try{
        const r = await fetch(`${API}/search?keyword=${encodeURIComponent(kw)}`);
        const d = await r.json();
        clearInterval(timer);
        products.value = d.products || [];
        sourceStatus.value = Object.entries(d.source_status||{}).map(([k,ok])=>({
          label: ({jd:'京东',taobao:'淘宝',pdd:'拼多多',mock:'演示'})[k]||k, ok
        }));
        updatedAt.value = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
        if(d.message && !products.value.length) errorMsg.value = d.message;
        if(products.value.length) showToast(`找到 ${products.value.length} 款商品`);
        expanded.value = products.value.reduce((a,_,i)=>(a[i]=i===0,a),{});
      }catch(e){
        clearInterval(timer);
        errorMsg.value = '网络错误，请稍后重试';
        console.error(e);
      }finally{
        loading.value = false;
      }
    }

    onMounted(()=>{
      document.documentElement.setAttribute('data-theme', theme.value);
    });

    return { keyword, products, searched, loading, loadingStatus, errorMsg, expanded, sourceStatus, updatedAt,
             theme, hotKeywords, trendLines, trendViewBox, totalOffers, bestProduct, aiRecommendText, toast,
             fmt, listPriceOf, bestSaveOf, emojiFor, toggleTheme, toggleExpand, reset, doSearch };
  }
}).mount('#app');
</script>
</body>
</html>
