<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>全价比价 · 全网商品智能比价</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0e14">
<script src="vue.global.prod.js"></script>
<style>
  /* ═══════════ 设计令牌 ═══════════ */
  :root{
    --bg:#0b0e14; --bg2:#10141d; --card:#141926; --card2:#1a2131;
    --line:#232c40; --line2:#2c3852;
    --text:#e8ecf4; --text2:#9aa5b8; --text3:#5c6a85;
    --gold:#d4af37; --gold2:#f0d68a;
    --up:#ff5d5d; --down:#3dd68c;
    --accent:#4d9fff; --purple:#8b7cf6;
    --shadow:0 8px 32px rgba(0,0,0,.45);
    --radius:14px;
    --font: -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--font); min-height:100vh;
    background-image:
      radial-gradient(1000px 500px at 80% -10%, rgba(77,159,255,.07), transparent),
      radial-gradient(800px 400px at -10% 110%, rgba(139,124,246,.06), transparent);
  }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#2c3852;border-radius:4px}
  [v-cloak]{display:none}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px}

  /* ═══════════ 顶部搜索 ═══════════ */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(11,14,20,.85);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line); padding:14px 0;
  }
  .topbar-inner{display:flex;align-items:center;gap:16px}
  .logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:1px;white-space:nowrap}
  .logo-mark{
    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(135deg,#d4af37,#8a5a12);
    font-size:17px;color:#fff;box-shadow:0 0 20px rgba(212,175,55,.35);
  }
  .logo b{background:linear-gradient(90deg,#f0d68a,#d4af37);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .search-box{
    flex:1;display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;transition:border-color .2s;
  }
  .search-box:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
  .search-box .s-icon{color:var(--text3);font-size:16px}
  .search-box input{
    flex:1;background:none;border:none;outline:none;color:var(--text);
    font-size:15px;font-family:var(--font);
  }
  .search-box input::placeholder{color:var(--text3)}
  .search-btn{
    border:none;border-radius:9px;padding:9px 22px;cursor:pointer;
    background:linear-gradient(135deg,#d4af37,#b8860b);color:#1a1505;font-weight:700;
    font-size:14px;letter-spacing:1px;transition:transform .15s,box-shadow .2s;
    font-family:var(--font);
  }
  .search-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(212,175,55,.35)}
  .search-btn:disabled{opacity:.5;cursor:wait;transform:none}
  .theme-btn{
    background:var(--card);border:1px solid var(--line);color:var(--text2);
    border-radius:10px;padding:9px 13px;cursor:pointer;font-size:15px;font-family:var(--font);
  }
  .hot-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .tag{
    background:var(--card);border:1px solid var(--line);color:var(--text2);
    border-radius:999px;padding:5px 13px;font-size:12px;cursor:pointer;transition:all .2s;
    font-family:var(--font);
  }
  .tag:hover{border-color:var(--gold);color:var(--gold)}

  /* ═══════════ 商品概览 Hero ═══════════ */
  .hero-card{
    display:grid;grid-template-columns:240px 1fr;gap:28px;
    background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:28px;margin-top:22px;box-shadow:var(--shadow);
    position:relative;overflow:hidden;
  }
  .hero-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,#d4af37,transparent);
  }
  .hero-img-wrap{
    border-radius:12px;overflow:hidden;border:1px solid var(--line2);
    background:#0d1120;display:grid;place-items:center;align-self:start;
  }
  .hero-img{width:100%;display:block;aspect-ratio:1;object-fit:cover}
  .hero-info{min-width:0}
  .hero-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand-badge{
    background:linear-gradient(135deg,rgba(212,175,55,.18),rgba(212,175,55,.06));
    border:1px solid rgba(212,175,55,.4);color:var(--gold2);
    padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:1px;
  }
  .hero-title{font-size:22px;font-weight:800;letter-spacing:.5px;margin:8px 0 4px}
  .hero-slogan{
    color:var(--gold2);font-size:14px;letter-spacing:2px;margin-bottom:8px;
    font-style:italic;
  }
  .hero-desc{color:var(--text2);font-size:13px;line-height:1.7;margin-bottom:14px}
  .hero-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text2)}
  .stars{color:var(--gold);letter-spacing:2px;font-size:15px}
  .spec-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{
    background:rgba(77,159,255,.08);border:1px solid rgba(77,159,255,.25);color:#9cc3ff;
    padding:4px 12px;border-radius:8px;font-size:12px;
  }
  .chip b{font-weight:600}
  .hero-price{text-align:right;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:180px}
  .hero-price .label{color:var(--text3);font-size:12px;letter-spacing:2px}
  .hero-price .num{
    font-size:40px;font-weight:900;line-height:1;
    background:linear-gradient(180deg,#fff,#d4af37);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    font-variant-numeric:tabular-nums;
  }
  .hero-price .platform{color:var(--gold2);font-size:13px;font-weight:600}

  /* ═══════════ 规格选择器 ═══════════ */
  .spec-selector{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
  .ss-label{color:var(--text3);font-size:11px;letter-spacing:1px;margin-right:2px}
  .ss-item{
    background:var(--card2);border:1px solid var(--line2);color:var(--text2);
    border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer;transition:all .18s;
  }
  .ss-item:hover{border-color:var(--gold);color:var(--gold)}
  .ss-active{
    background:rgba(212,175,55,.15);border-color:var(--gold);color:var(--gold2);
    font-weight:700;
  }

  /* ═══════════ KPI 指标条 ═══════════ */
  .kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:14px}
  .kpi{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;position:relative;overflow:hidden;transition:transform .2s;
  }
  .kpi:hover{transform:translateY(-2px);border-color:var(--line2)}
  .kpi::after{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--gold),transparent);opacity:.7;
  }
  .kpi .k-label{color:var(--text3);font-size:11px;letter-spacing:1.5px;margin-bottom:6px}
  .kpi .k-value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
  .kpi .k-sub{color:var(--text3);font-size:11px;margin-top:3px}
  .kpi.accent .k-value{color:var(--gold2)}

  /* ═══════════ 图表网格 ═══════════ */
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;min-width:0;
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .panel-title{font-size:14px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:8px}
  .panel-title .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(212,175,55,.8)}
  .panel-sub{color:var(--text3);font-size:11px}
  .chart-svg{width:100%;display:block;max-width:100%;overflow:visible}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
  .legend-item i{width:14px;height:3px;border-radius:2px;display:inline-block}

  /* ═══════════ AI 推荐 ═══════════ */
  .ai-panel{
    margin-top:14px;position:relative;overflow:hidden;
    background:linear-gradient(135deg,rgba(139,124,246,.12),rgba(77,159,255,.06) 50%,var(--card));
    border:1px solid rgba(139,124,246,.35);border-radius:var(--radius);padding:20px 24px;
  }
  .ai-panel::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--purple),var(--accent),transparent);
  }
  .ai-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .ai-badge{
    background:linear-gradient(135deg,var(--purple),#6a5ae0);color:#fff;
    padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:1px;
  }
  .ai-head .ai-label{color:var(--text2);font-size:12px}
  .ai-body{color:var(--text);font-size:14px;line-height:1.9}
  .ai-body b{color:var(--gold2)}

  /* ═══════════ 规格参数 ═══════════ */
  .spec-table{width:100%;border-collapse:collapse;font-size:13px}
  .spec-table td{padding:8px 14px;border-bottom:1px solid var(--line)}
  .spec-table tr:nth-child(odd) td{background:rgba(255,255,255,.015)}
  .spec-table td:first-child{color:var(--text3);width:130px;white-space:nowrap}
  .spec-table td:last-child{color:var(--text)}

  /* ═══════════ 平台报价表 ═══════════ */
  .offer-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
  .offer-table th{
    text-align:left;padding:10px 14px;color:var(--text3);font-size:11px;
    letter-spacing:1.5px;border-bottom:1px solid var(--line2);font-weight:600;
  }
  .offer-table td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  .offer-table tr:last-child td{border-bottom:none}
  .offer-table tr:hover td{background:rgba(255,255,255,.02)}
  .plat-badge{display:inline-flex;align-items:center;gap:6px;font-weight:700}
  .plat-dot{width:9px;height:9px;border-radius:50%}
  .row-lowest{background:rgba(61,214,140,.05)}
  .row-lowest td:first-child{border-left:3px solid var(--down)}
  .offer-final{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
  .offer-save{color:var(--down);font-size:11px;font-weight:600}
  .offer-detail{color:var(--text3);font-size:11px;margin-top:3px}
  .offer-sales{color:var(--text2);font-size:12px}
  .offer-stock{font-size:11px}
  .stock-yes{color:var(--down)} .stock-no{color:var(--up)}
  .go-btn{
    display:inline-block;padding:7px 18px;border-radius:8px;text-decoration:none;
    background:var(--card2);border:1px solid var(--line2);color:var(--text);
    font-size:12px;font-weight:600;transition:all .2s;white-space:nowrap;
  }
  .go-btn:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
  .lowest-flag{
    display:inline-block;background:rgba(61,214,140,.15);color:var(--down);
    border:1px solid rgba(61,214,140,.4);border-radius:999px;
    font-size:10px;padding:2px 8px;margin-left:6px;font-weight:700;
  }

  /* ═══════════ 加载 & 空态 ═══════════ */
  .loading-panel{
    margin-top:22px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:50px;text-align:center;
  }
  .spinner{
    width:36px;height:36px;border-radius:50%;margin:0 auto 16px;
    border:3px solid var(--line2);border-top-color:var(--gold);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-panel p{color:var(--text2);font-size:13px}
  .error-panel{
    margin-top:22px;background:rgba(255,93,93,.06);border:1px solid rgba(255,93,93,.3);
    border-radius:var(--radius);padding:30px;text-align:center;color:var(--up);font-size:14px;
  }
  .hero-empty{
    margin-top:80px;text-align:center;color:var(--text3);
  }
  .hero-empty .big{font-size:64px;margin-bottom:16px;opacity:.5}
  .hero-empty h1{font-size:26px;color:var(--text);margin-bottom:10px;letter-spacing:2px}
  .hero-empty p{font-size:14px;line-height:1.8}

  /* ═══════════ 页脚 ═══════════ */
  .footer{margin:40px 0 24px;text-align:center;color:var(--text3);font-size:11px;letter-spacing:1px}

  /* ═══════════ 优惠方案卡片 ═══════════ */
  .plans-area{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .plans-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px}
  .plans-title{font-size:14px;font-weight:700}
  .plans-hint{color:var(--text3);font-size:11px}
  .plans-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .plan-card{
    background:var(--card2);border:1px solid var(--line);border-radius:12px;
    padding:14px;transition:all .2s;position:relative;
  }
  .plan-card:hover{border-color:var(--line2);transform:translateY(-1px)}
  .plan-card.plan-best{
    border-color:rgba(212,175,55,.5);
    background:linear-gradient(135deg,rgba(212,175,55,.08),var(--card2));
    box-shadow:0 0 20px rgba(212,175,55,.08);
  }
  .plan-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .plan-badge{
    background:linear-gradient(135deg,#d4af37,#8a5a12);color:#1a1505;
    font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.5px;
  }
  .plan-name{color:var(--text2);font-size:12px;flex:1}
  .plan-final{font-size:17px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}
  .plan-steps{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
  .plan-step{display:flex;justify-content:space-between;align-items:center;font-size:12px}
  .step-label{color:var(--text2)}
  .step-amount{font-weight:600;font-variant-numeric:tabular-nums}
  .plan-total{font-size:12px;color:var(--text2);border-top:1px dashed var(--line2);padding-top:8px}
  .row-open td{background:rgba(212,175,55,.04)}

  /* ═══════════ 社交成交价 ═══════════ */
  .social-panel{
    margin-top:14px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:20px;min-width:0;
  }
  .social-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .social-badge{
    background:linear-gradient(135deg,#ff8c42,#e85d2a);color:#fff;
    padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:1px;
  }
  .social-title{font-size:14px;font-weight:700}
  .social-src{color:var(--text3);font-size:11px;margin-left:auto}
  .social-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .social-kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  .social-kpi .sk-label{color:var(--text3);font-size:10px;letter-spacing:1px;margin-bottom:4px}
  .social-kpi .sk-value{font-size:17px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}
  .social-deals{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .deal-card{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;transition:all .2s}
  .deal-card:hover{border-color:var(--line2)}
  .deal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .deal-platform{
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;
    background:rgba(77,159,255,.12);color:#9cc3ff;
  }
  .deal-price{font-size:16px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
  .deal-coupon{color:var(--down);font-size:11px;margin-top:4px}
  .deal-time{color:var(--text3);font-size:10px;margin-top:4px}
  .social-summary{
    margin-top:14px;background:linear-gradient(135deg,rgba(139,124,246,.1),rgba(77,159,255,.05));
    border:1px solid rgba(139,124,246,.25);border-radius:10px;padding:14px 16px;
    font-size:13px;line-height:1.9;color:var(--text);
  }
  .social-summary b{color:var(--gold2)}
  .social-loading{color:var(--text3);font-size:13px;padding:20px 0;text-align:center}

  /* ═══════════ 响应式 ═══════════ */
  @media(max-width:900px){
    .kpi-row{grid-template-columns:repeat(3,1fr)}
    .chart-grid{grid-template-columns:1fr}
    .hero-card{grid-template-columns:140px 1fr;padding:20px}
    .hero-price .num{font-size:30px}
  }
  @media(max-width:640px){
    .wrap{padding:0 12px}
    .logo span{display:none}
    .theme-btn{padding:9px 11px;flex:none}
    .search-box{min-width:0}
    .search-box input{min-width:0}
    .kpi-row{grid-template-columns:repeat(2,1fr);gap:8px}
    .hero-card{grid-template-columns:1fr;padding:16px}
    .hero-img-wrap{max-width:180px;margin:0 auto}
    .hero-price{text-align:left;flex-direction:row;align-items:baseline;gap:10px;min-width:0}
    .hero-price .num{font-size:26px}
    .search-btn{padding:10px 14px;min-height:40px}
    /* 手机端报价表压缩列 */
    .offer-table th:nth-child(2),.offer-table td:nth-child(2){display:none}
    .offer-table th:nth-child(6),.offer-table td:nth-child(6){display:none}
    .offer-table td,.offer-table th{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .offer-detail{white-space:normal}
    .go-btn{padding:6px 10px;font-size:11px}
    .panel{padding:14px}
    .hero-title{font-size:18px}
    .chart-grid{grid-template-columns:1fr}
    .social-kpis{grid-template-columns:repeat(2,1fr)}
    .plans-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="app" v-cloak>

  <!-- ═══════ 顶部 ═══════ -->
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="logo">
        <div class="logo-mark">价</div>
        <span>全价<b>比价</b></span>
      </div>
      <div class="search-box">
        <span class="s-icon">🔍</span>
        <input v-model="keyword" @keyup="onKeyUp" placeholder="搜索商品：品牌 + 型号，如 iPhone 15 Pro">
        <button class="search-btn" @click="doSearch" :disabled="loading">{{ loading ? '比价中…' : '全网比价' }}</button>
      </div>
      <button class="theme-btn" @click="toggleTheme">{{ theme==='dark' ? '☀️' : '🌙' }}</button>
    </div>
    <div class="wrap" v-if="!searched">
      <div class="hot-tags">
        <span class="tag" v-for="t in hotKeywords" :key="t" @click="quickSearch(t)">{{ t }}</span>
      </div>
    </div>
  </header>

  <main class="wrap">

    <!-- ═══════ 初始状态 ═══════ -->
    <div class="hero-empty" v-if="!searched && !loading">
      <div class="big">🛒</div>
      <h1>一个商品 · 全网所有平台比价</h1>
      <p>京东 / 淘宝 / 拼多多实时报价 · 优惠叠加计算到手价<br>90 天历史走势 · AI 智能购买建议</p>
    </div>

    <!-- ═══════ 加载 ═══════ -->
    <div class="loading-panel" v-if="loading">
      <div class="spinner"></div>
      <p>正在全网搜索「{{ keyword }}」…</p>
    </div>

    <!-- ═══════ 错误 ═══════ -->
    <div class="error-panel" v-if="errorMsg">{{ errorMsg }}</div>

    <!-- ═══════ 看板（搜索后） ═══════ -->
    <template v-if="searched && !loading && products.length">

      <!-- 商品概览 -->

        <div class="hero-price">

      <!-- KPI 指标条 -->

        <div class="kpi"><div class="k-label">优惠节省</div><div class="k-value" style="color:var(--down)">¥{{ fmt(curMain.price_stats.savings) }}</div><div class="k-sub">叠加后已省</div></div>
        <div class="kpi"><div class="k-label">历史最低</div><div class="k-value">¥{{ fmt(curMain.lowest_90d || curMain.best_price) }}</div><div class="k-sub">90 天窗口</div></div>
        <div class="kpi"><div class="k-label">评分</div><div class="k-value">{{ curMain.rating || '—' }}</div><div class="k-sub">{{ fmtCount(curMain.review_count) }} 评价</div></div>

            <text v-for="(gl,g) in trendGridLabels" :key="'gl'+g" :x="0" :y="trendGridY[g]-4" fill="var(--text3)" font-size="9">{{ gl }}</text>
            <polyline v-for="(s,si) in trendSeries" :key="'s'+si" :points="s.points" fill="none" :stroke="s.color" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>
            <circle v-for="(pt,pi) in trendSeries[0] ? trendSeries[0].pts : []" :key="'pt'+pi" :cx="pt.x" :cy="pt.y" r="2.5" fill="#fff" stroke="#d4af37" stroke-width="1.5"/>

          <div class="legend">
            <span class="legend-item" v-for="(s,si) in trendLegend" :key="'lg'+si"><i :style="{background:s.color}"></i>{{ s.label }}</span>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div class="panel-title"><span class="dot"></span>平台到手价对比</div>
            <span class="panel-sub">最低价高亮</span>
          </div>
          <svg class="chart-svg" viewBox="0 0 520 200" preserveAspectRatio="none">
            <text v-for="(b,bi) in barData" :key="'bl'+bi" :x="0" :y="b.y+4" fill="var(--text2)" font-size="11">{{ b.label }}</text>
            <rect v-for="(b,bi) in barData" :key="'br'+bi" :x="58" :y="b.y-10" :width="b.w" height="20" rx="5"
                  :fill="b.isBest ? 'url(#barGold)' : 'var(--card2)'" :stroke="b.isBest ? 'rgba(212,175,55,.6)' : 'var(--line2)'" stroke-width="1"/>
            <text v-for="(b,bi) in barData" :key="'bv'+bi" :x="b.w+64" :y="b.y+4" fill="#fff" font-size="11" font-weight="700">¥{{ fmt(b.price) }}</text>
            <defs><linearGradient id="barGold" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#d4af37"/><stop offset="1" stop-color="#8a5a12"/>
            </linearGradient></defs>
          </svg>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div class="panel-title"><span class="dot"></span>价格构成分析</div>
            <span class="panel-sub">标价 → 优惠 → 到手</span>
          </div>
          <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
            <svg class="chart-svg" viewBox="0 0 180 180" style="width:180px;flex:none">
              <circle cx="90" cy="90" r="62" fill="none" stroke="var(--card2)" stroke-width="26"/>
              <circle cx="90" cy="90" r="62" fill="none" stroke="#d4af37" stroke-width="26"
                      :stroke-dasharray="donutBest.dash" :stroke-dashoffset="donutBest.offset"
                      transform="rotate(-90 90 90)" stroke-linecap="butt"/>
              <text x="90" y="86" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">¥{{ fmt(curMain.best_price) }}</text>
              <text x="90" y="104" text-anchor="middle" fill="var(--text3)" font-size="10">最低到手</text>
            </svg>
            <div style="flex:1;min-width:200px">
              <div class="legend" style="flex-direction:column;gap:10px">
                <span class="legend-item"><i style="background:var(--line2)"></i>平台标价 ¥{{ fmt(curMain.offers[0].list_price) }}</span>
                <span class="legend-item"><i style="background:var(--down)"></i>优惠叠加 −¥{{ fmt(curMain.price_stats.savings) }}</span>

        <div class="panel">

          </div>
          <svg class="chart-svg" viewBox="0 0 520 200" preserveAspectRatio="none">
            <rect v-for="(h,hi) in histData" :key="'h'+hi" :x="h.x" :y="h.y" :width="h.w" :height="h.h" rx="3"
                  :fill="h.isCurrent ? '#d4af37' : 'rgba(77,159,255,.35)'"/>
            <text v-for="(hl,hi) in histLabels" :key="'hl'+hi" :x="hl.x" :y="histBase+4" fill="var(--text3)" font-size="9" text-anchor="middle">{{ hl.label }}</text>
          </svg>

      </section>

      <!-- AI 智能推荐 -->
      <section class="ai-panel" v-if="curMain.recommendation">
        <div class="ai-head">
          <span class="ai-badge">AI 智选</span>

      <!-- 全网真实成交价（社交晒价 + AI 分析） -->
      <section class="social-panel">
        <div class="social-head">
          <span class="social-badge">👥 全网成交价</span>
          <span class="social-title">大家实际买到多少钱</span>
          <span class="social-src">{{ socialDeals.source === 'demo' ? '社交源暂不可达 · 演示数据 + AI 分析' : '来源：什么值得买等晒价平台' }}</span>
        </div>

        <div class="social-loading" v-if="socialLoading">正在分析社交平台晒价数据…</div>

        <template v-if="!socialLoading && socialDeals.deals && socialDeals.deals.length">
          <div class="social-kpis">
            <div class="social-kpi"><div class="sk-label">最低成交</div><div class="sk-value">¥{{ fmt(socialDeals.price_range.low) }}</div></div>
            <div class="social-kpi"><div class="sk-label">最高成交</div><div class="sk-value">¥{{ fmt(socialDeals.price_range.high) }}</div></div>
            <div class="social-kpi"><div class="sk-label">平均成交</div><div class="sk-value">¥{{ fmt(socialDeals.price_range.avg) }}</div></div>
            <div class="social-kpi"><div class="sk-label">最常见平台</div><div class="sk-value" style="font-size:14px">{{ socialDeals.common_platform || '—' }}</div></div>
          </div>
          <div class="social-deals">
            <div class="deal-card" v-for="(d,di) in socialDeals.deals.slice(0,6)" :key="di">
              <div class="deal-top">
                <span class="deal-platform">{{ d.buy_platform || d.platform }}</span>
                <span class="deal-price">¥{{ fmt(d.price) }}</span>
              </div>
              <div class="deal-coupon" v-if="d.coupon_info">🎟️ {{ d.coupon_info }}</div>

            <b>🤖 AI 攻略</b><br>{{ socialDeals.ai_summary }}
          </div>
        </template>
      </section>

      <!-- 规格参数 + 报价明细 -->
      <section class="chart-grid" style="margin-top:14px">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title"><span class="dot"></span>规格参数</div>
            <span class="panel-sub">{{ curMain.specs.length || Object.keys(curMain.specs).length }} 项</span>
          </div>
          <table class="spec-table">
            <tr v-for="(v,k) in curMain.specs" :key="k">
              <td>{{ k }}</td><td>{{ v }}</td>
            </tr>
          </table>
        </div>
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title"><span class="dot"></span>平台报价明细</div>
            <span class="panel-sub">{{ curMain.offers.length }} 个平台 · 按到手价排序 · 点击行看优惠方案</span>
          </div>
          <table class="offer-table">
            <thead><tr>
              <th>平台</th><th>店铺</th><th>标价</th><th>优惠</th><th>到手价</th><th>销量</th><th></th>
            </tr></thead>
            <tbody>
              <tr v-for="(o,oi) in sortedOffersOf(curMain)" :key="oi"
                  :class="{'row-lowest': o.final_price===curMain.best_price, 'row-open': expandedOffer===oi}"
                  style="cursor:pointer" @click="toggleOfferPlan(oi)">
                <td>
                  <span class="plat-badge"><span class="plat-dot" :style="{background:platColorOf(o.platform)}"></span>{{ o.platform_label }}</span>
                  <span class="lowest-flag" v-if="o.final_price===curMain.best_price">最低</span>
                </td>
                <td style="color:var(--text2)">{{ o.shop_name || '—' }}</td>
                <td style="color:var(--text3);text-decoration:line-through">¥{{ fmt(o.list_price) }}</td>
                <td>
                  <div style="color:var(--down);font-size:12px;font-weight:600">−¥{{ fmt(o.list_price - o.final_price) }}</div>
                  <div class="offer-detail">{{ o.price_detail }}</div>
                </td>
                <td><span class="offer-final">¥{{ fmt(o.final_price) }}</span></td>
                <td class="offer-sales">{{ o.sales || '—' }}</td>
                <td><a class="go-btn" :href="o.url" target="_blank" rel="noopener" @click.stop>去购买 →</a></td>
              </tr>
            </tbody>
          </table>

          <!-- 优惠组合方案（点击平台行展开） -->
          <div v-if="expandedOffer !== null && expandedOfferData" class="plans-area">
            <div class="plans-head">
              <span class="plans-title">🎟️ {{ expandedOfferData.platform_label }} · 当前可用优惠组合（{{ expandedOfferData.plans.length }} 种）</span>
              <span class="plans-hint">实时可用的叠加方式 · 每种单独算</span>
            </div>
            <div v-if="!expandedOfferData.plans.length" style="color:var(--text3);font-size:13px;padding:16px 0;text-align:center">
              该平台当前无可用优惠组合，直接按 {{ fmt(expandedOfferData.final_price) }} 元入手
            </div>
            <div class="plans-grid" v-else>
              <div v-for="(pl,pi) in expandedOfferData.plans" :key="pi"
                   class="plan-card" :class="{'plan-best': pl.is_best}">
                <div class="plan-top">
                  <span class="plan-badge" v-if="pl.is_best">最低价方案</span>
                  <span class="plan-name">方案{{ pl.plan_index }}</span>
                  <span class="plan-final">¥{{ fmt(pl.final_price) }}</span>
                </div>
                <div class="plan-steps">
                  <div v-for="(s,si) in pl.steps" :key="si" class="plan-step">
                    <span class="step-label">{{ s.label }}</span>
                    <span class="step-amount" :style="{color: (s.amount||0) < 0 ? 'var(--down)' : ((s.amount||0) > 0 ? 'var(--up)' : 'var(--text3)')}">
                      {{ (s.amount||0) < 0 ? '−¥' + fmt(-s.amount) : ((s.amount||0) > 0 ? '+¥' + fmt(s.amount) : '') }}
                    </span>
                  </div>
                </div>
                <div class="plan-total">
                  共省 <b style="color:var(--down)">¥{{ fmt(pl.total_saved) }}</b> · 到手 <b>¥{{ fmt(pl.final_price) }}</b>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 更多商品 -->
      <section v-if="products.length > 1" style="margin-top:22px">
        <div class="panel-head" style="padding:0 4px">
          <div class="panel-title"><span class="dot"></span>同关键词 · 其他商品</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:10px">
          <div v-for="(p,i) in products.slice(1)" :key="p.sku_fingerprint"
               style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:all .2s"
               @click="scrollTo(i+1)">
            <img :src="p.image_url || fallbackImg" style="width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none" alt="">
            <div style="min-width:0">
              <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.name }}</div>
              <div style="font-size:12px;color:var(--gold2);font-weight:700;margin-top:4px">¥{{ fmt(p.best_price) }}</div>
              <div style="font-size:11px;color:var(--text3)">{{ p.best_platform_label }}</div>
            </div>
          </div>
        </div>
      </section>

    </template>

    <!-- 空结果 -->
    <div class="error-panel" v-if="searched && !loading && !products.length">
      {{ emptyMsg || '未找到该商品，试试更精确的关键词' }}
    </div>

  </main>

  <footer class="footer">全价比价 · 数据仅供参考 · 以平台实时价格为准</footer>

</div>

<script>
const { createApp, ref, computed } = Vue;

createApp({
  setup(){
    const HOT = ['iPhone 15 Pro','华为 Mate 60 Pro','小米 14 Pro','索尼 WH-1000XM5','戴森 V15','MacBook Air'];
    const PLAT_COLORS = { jd:'#e8380d', taobao:'#ff5000', pdd:'#e02e24', mock:'#8b7cf6', xianyu:'#fcee21' };

    const keyword = ref('');
    const products = ref([]);
    const searched = ref(false);
    const loading = ref(false);
    const errorMsg = ref('');
    const emptyMsg = ref('');
    const theme = ref(localStorage.getItem('allprice_theme') || 'dark');
    const hotKeywords = HOT;
    // 纯 ASCII 内嵌 SVG（btoa 不支持非 Latin1 字符）
    const fallbackImg = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#1a2131"/><text x="100" y="115" font-size="60" text-anchor="middle" fill="#5c6a85">$</text></svg>');

    // ── 工具 ──
    function fmt(n){
      if(n===null||n===undefined||isNaN(n)) return '—';
      return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
    }
    function fmtCount(n){
      if(!n) return '';
      return n>=10000 ? (n/10000).toFixed(1)+'万' : n;
    }
    function bestOf(p){ return p || {best_price:null,price_stats:{avg:0,high:0,low:0,savings:0},offers:[]}; }

    // ── 多规格变体：当前激活规格 ──
    const activeVariant = ref({});  // sku_fingerprint → 变体索引
    function allVariantsOf(p){
      const arr = [p].concat(p.variants || []);
      return arr.filter(Boolean);
    }
    function activeIdxOf(p){
      const idx = activeVariant.value[p.sku_fingerprint];
      const total = 1 + (p.variants || []).length;
      return (idx !== undefined && idx < total) ? idx : 0;
    }
    function currentOf(p){
      const arr = allVariantsOf(p);
      return arr[activeIdxOf(p)] || arr[0] || p;
    }
    function selectVariant(p, vi){
      activeVariant.value[p.sku_fingerprint] = vi;
      // 切换规格后重置报价表展开
      expandedOffer.value = 0;
    }
    function variantShortName(v){
      const s = v.specs || {};
      return (s['颜色'] || s['存储容量'] || s['内存'] || s['版本'] || v.name || '').toString().slice(0, 12);
    }
    // ── 优惠组合方案展开（声明先于引用，避免 TDZ） ──
    const expandedOffer = ref(null);
    const expandedOfferData = computed(()=>{
      if(expandedOffer.value === null) return null;
      const base = currentOf(products.value[0] || {});
      const offers = (base && base.offers) ? [...base.offers].sort((a,b)=>a.final_price-b.final_price) : [];
      return offers[expandedOffer.value] || null;
    });
    function toggleOfferPlan(i){
      expandedOffer.value = expandedOffer.value === i ? null : i;
    }

    // 主商品（KPI/图表/报价表联动）→ 当前激活变体
    const curMain = computed(() => currentOf(products.value[0] || {}));
    function specChipsOf(p){
      const s = p.specs || {};
      const keys = ['品牌','型号','颜色','存储容量','内存','屏幕','芯片','摄像头','电池','重量','续航'];
      const out = {};
      for(const k of keys){ if(s[k] !== undefined && s[k] !== '') out[k]=s[k]; }
      return out;
    }
    function sortedOffersOf(p){
      return [...(p.offers||[])].sort((a,b)=>a.final_price-b.final_price);
    }
    function platColorOf(plat){ return PLAT_COLORS[plat] || '#8b7cf6'; }
    function priceGapOf(p){ return (p.price_stats.high||0) - (p.price_stats.low||0); }

    // ── 搜索 ──
    async function doSearch(){
      const kw = keyword.value.trim();
      if(!kw || loading.value) return;
      loading.value = true; errorMsg.value=''; emptyMsg.value='';
      products.value = [];
      try{
        const r = await fetch('/api/search?keyword='+encodeURIComponent(kw)+'&limit=6', {signal: AbortSignal.timeout(30000)});
        const d = await r.json();
        if(!r.ok) throw new Error(d.detail || '请求失败');
        if(d.products && d.products.length){
          products.value = d.products;
          searched.value = true;
          expandedOffer.value = 0;  // 默认展开最低价平台
          // 异步加载社交成交价（不阻塞搜索渲染）
          if(socialTimer) clearTimeout(socialTimer);
          socialTimer = setTimeout(loadSocialDeals, 600);
        }else{
          searched.value = true;
          emptyMsg.value = d.message || '未找到该商品，试试更精确的关键词';
        }
      }catch(e){
        errorMsg.value = '网络错误或服务超时，请稍后重试';
        console.error(e);
      }finally{
        loading.value = false;
      }
    }
    function quickSearch(t){ keyword.value = t; doSearch(); }
    function onKeyUp(e){ if(e.key === 'Enter') doSearch(); }
    function scrollTo(i){
      const cards = document.querySelectorAll('.hero-card');
      if(cards[i]) cards[i].scrollIntoView({behavior:'smooth', block:'start'});
    }
    function toggleTheme(){
      theme.value = theme.value==='dark' ? 'light' : 'dark';
      localStorage.setItem('allprice_theme', theme.value);
      document.documentElement.setAttribute('data-theme', theme.value);
      location.reload();
    }


    // ── 社交成交价（异步加载，不阻塞搜索） ──
    const socialDeals = ref({deals: [], price_range: {}, common_platform: '', ai_summary: '', source: ''});
    const socialLoading = ref(false);
    let socialTimer = null;
    async function loadSocialDeals(){
      const kw = keyword.value.trim();
      if(!kw) return;
      socialLoading.value = true;
      try{
        const r = await fetch('/api/social-deals?keyword='+encodeURIComponent(kw)+'&limit=8', {signal: AbortSignal.timeout(30000)});
        if(r.ok) socialDeals.value = await r.json();
      }catch(e){
        console.error('social deals failed:', e);
      }finally{
        socialLoading.value = false;
      }
    }

    // ── 图表：90天走势 ──
    const trendW = 520, trendH = 220;
    const trendSeries = computed(() => {
      const p = curMain.value;
      const hist = p.history || [];
      if(!hist.length) return [];
      // 每平台一条线（取各平台报价做基准色；数据点只有全网最低时画一条）
      const min = Math.min(...hist.map(h=>h.price));
      const max = Math.max(...hist.map(h=>h.price));
      const pad = (max-min)*0.12 || max*0.02;
      const lo = min-pad, hi = max+pad;
      const x = i => i/(hist.length-1)*(trendW-40)+10;
      const y = v => trendH-20 - (v-lo)/(hi-lo)*(trendH-44);
      const pts = hist.map((h,i)=>({x:x(i), y:y(h.price), price:h.price}));
      return [{
        color:'#d4af37',
        points: pts.map(pt=>`${pt.x},${pt.y}`).join(' '),
        pts
      }];
    });
    const trendGridY = computed(()=>{
      const p = curMain.value;
      const hist = p.history || [];
      if(!hist.length) return [20,70,120,170,200];
      const min = Math.min(...hist.map(h=>h.price));
      const max = Math.max(...hist.map(h=>h.price));
      const pad = (max-min)*0.12 || max*0.02;
      const lo = min-pad, hi = max+pad;
      return [0,1,2,3,4].map(i=> 20 + i*(trendH-44)/4);
    });
    const trendGridLabels = computed(()=>{
      const p = curMain.value;
      const hist = p.history || [];
      if(!hist.length) return [];
      const min = Math.min(...hist.map(h=>h.price));
      const max = Math.max(...hist.map(h=>h.price));
      const pad = (max-min)*0.12 || max*0.02;
      const lo = min-pad, hi = max+pad;
      return [0,1,2,3,4].map(i=>{
        const v = hi - (hi-lo)*i/4;
        return '¥'+Math.round(v);
      });
    });
    const trendLegend = computed(()=>{
      const p = curMain.value;
      const labels = (p.offers||[]).map(o=>o.platform_label);
      const uniq = [...new Set(labels)];
      return [{label:'全网最低到手价（'+ (uniq.join('/')||'全网') +'）', color:'#d4af37'}];
    });

    // ── 图表：平台对比条形图 ──
    const barW = 520, barH = 200;
    const barData = computed(()=>{
      const p = curMain.value;
      const offers = sortedOffersOf(p);
      const maxP = Math.max(...offers.map(o=>o.list_price||o.final_price), 1);
      const usable = barW - 90;
      return offers.map((o,i)=>{
        const w = Math.max(24, (o.final_price/maxP)*usable);
        return { label:o.platform_label, price:o.final_price, w, y:24+i*44,
                 isBest:o.final_price===p.best_price };
      });
    });

    // ── 图表：环形图 ──
    const donutBest = computed(()=>{
      const p = curMain.value;
      const offer = p.offers && p.offers[0];
      const list = offer ? offer.list_price : p.best_price||0;
      const cur = p.best_price||0;
      const ratio = list>0 ? Math.max(0.25, cur/list) : 1;
      const C = 2*Math.PI*62;
      return { dash:`${C*ratio} ${C}`, offset:0 };
    });

    // ── 图表：价格区间直方图 ──
    const histW = 520, histH = 200;
    // 直方图 Y 基线高度（模板引用需要暴露）
    const histBase = histH - 24;
    const histData = computed(()=>{
      const p = curMain.value;
      const hist = p.history || [];
      if(!hist.length) return [];
      const bins = 10;
      const min = Math.min(...hist.map(h=>h.price));
      const max = Math.max(...hist.map(h=>h.price));
      const span = (max-min)||1;
      const counts = new Array(bins).fill(0);
      for(const h of hist){
        const bi = Math.min(bins-1, Math.floor((h.price-min)/span*bins));
        counts[bi]++;
      }
      const cMax = Math.max(...counts, 1);
      const bw = (histW-30)/bins;
      const cur = p.best_price||0;
      return counts.map((c,i)=>{
        const x = 14+i*bw;
        const h = (c/cMax)*(histH-40);
        return { x, y: histH-24-h, w: bw-4, h,
                 isCurrent: cur>=min+i*span/bins && cur<=min+(i+1)*span/bins };
      });
    });
    const histLabels = computed(()=>{
      const p = curMain.value;
      const hist = p.history || [];
      if(!hist.length) return [];
      const min = Math.min(...hist.map(h=>h.price));
      const max = Math.max(...hist.map(h=>h.price));
      const bins = 10, bw = (histW-30)/bins;
      return [0, 5, 9].map(i=>({ x:14+i*bw+bw/2, label:'¥'+Math.round(min+(max-min)*i/9) }));
    });

    document.documentElement.setAttribute('data-theme', theme.value);

    return { keyword, products, searched, loading, errorMsg, emptyMsg, theme,
             hotKeywords, fallbackImg,
             fmt, fmtCount, bestOf, specChipsOf, sortedOffersOf, platColorOf, priceGapOf,
             curMain, allVariantsOf, activeIdxOf, currentOf, selectVariant, variantShortName,
             doSearch, quickSearch, onKeyUp, scrollTo, toggleTheme,
             expandedOffer, expandedOfferData, toggleOfferPlan,
             socialDeals, socialLoading,
             trendSeries, trendGridY, trendGridLabels, trendLegend,
             barData, donutBest,
             histData, histLabels, histBase };
  }
}).mount('#app');
</script>
</body>
</html>
